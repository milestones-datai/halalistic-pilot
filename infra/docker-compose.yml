services:
  postgres:
    image: postgres:16-alpine
    container_name: halalistic-postgres
    environment:
      POSTGRES_USER: halalistic
      POSTGRES_PASSWORD: halalistic
      POSTGRES_DB: halalistic
    ports:
      - "5432:5432"
    volumes:
      - halalistic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halalistic -d halalistic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  halalistic_pgdata:
