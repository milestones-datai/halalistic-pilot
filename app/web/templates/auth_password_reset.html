{% extends "base.html" %}
{% block title %}Reset your password — Halalistic{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="text-3xl font-bold text-halalistic-green mb-2">Reset your password</h1>
  <p class="text-gray-600 mb-6">
    Enter your email and we'll send a reset link.
    {% if message %}<span class="block mt-2 text-halalistic-saffron">{{ message }}</span>{% endif %}
  </p>
  <form method="post" action="/web/password-reset" class="card space-y-3">
    <div>
      <label class="field" for="email">Email</label>
      <input class="input" type="email" id="email" name="email" required>
    </div>
    <button class="btn btn-primary w-full" type="submit">Send reset link</button>
  </form>
  <p class="text-sm text-center text-gray-600 mt-3">
    <a href="/web/login" class="text-halalistic-green underline">Back to sign in</a>
  </p>
</div>
{% endblock %}
