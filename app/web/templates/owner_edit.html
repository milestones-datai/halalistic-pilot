{% extends "base.html" %}
{% block title %}Edit profile — Halalistic Owner{% endblock %}
{% block content %}
<div class="bg-halalistic-saffron-soft border border-halalistic-saffron rounded-lg p-3 mb-4 text-sm">
  Owner portal. <a href="/owner/dashboard" class="text-halalistic-green underline">← back</a>
</div>
<h1 class="text-2xl font-bold text-halalistic-green mb-4">Edit restaurant</h1>
<form method="post" action="/owner/restaurant/edit" class="card max-w-2xl space-y-3">
  <div>
    <label class="field">Name</label>
    <input class="input" type="text" name="name" value="{{ restaurant.name }}" required>
  </div>
  <div>
    <label class="field">Description</label>
    <textarea class="input" name="description" rows="3">{{ restaurant.description or '' }}</textarea>
  </div>
  <div>
    <label class="field">Address</label>
    <input class="input" type="text" name="address_line" value="{{ restaurant.address_line }}" required>
  </div>
  <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
    <div>
      <label class="field">City</label>
      <input class="input" type="text" name="city" value="{{ restaurant.city }}" required>
    </div>
    <div>
      <label class="field">State</label>
      <input class="input" type="text" name="state" value="{{ restaurant.state }}" maxlength="2" required>
    </div>
    <div>
      <label class="field">Postal code</label>
      <input class="input" type="text" name="postal_code" value="{{ restaurant.postal_code }}" required>
    </div>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
    <div>
      <label class="field">Phone</label>
      <input class="input" type="tel" name="phone" value="{{ restaurant.phone or '' }}">
    </div>
    <div>
      <label class="field">Website</label>
      <input class="input" type="url" name="website" value="{{ restaurant.website or '' }}">
    </div>
  </div>
  <div>
    <label class="field">Public email</label>
    <input class="input" type="email" name="email" value="{{ restaurant.email or '' }}">
  </div>
  <div>
    <label class="field">Price range</label>
    <select class="input" name="price_range">
      {% for v in ['1', '2', '3', '4'] %}
        <option value="{{ v }}" {% if restaurant.price_range == v %}selected{% endif %}>{{ '$' * v|int }}</option>
      {% endfor %}
    </select>
  </div>
  <button class="btn btn-primary" type="submit">Save</button>
</form>
{% endblock %}
