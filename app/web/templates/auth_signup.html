{% extends "base.html" %}
{% block title %}Sign up — Halalistic{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="text-3xl font-bold text-halalistic-green mb-2">Create your account</h1>
  <p class="text-gray-600 mb-6">Save restaurants, write reviews, earn points for gift cards.</p>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post" action="/web/signup" class="card space-y-3">
    <div>
      <label class="field" for="role">I am a…</label>
      <select class="input" id="role" name="role" required>
        <option value="diner">Diner — looking for halal spots</option>
        <option value="restaurant_owner">Restaurant Owner — listing my restaurant</option>
      </select>
    </div>
    <div>
      <label class="field" for="display_name">Display name</label>
      <input class="input" type="text" id="display_name" name="display_name" required minlength="2" maxlength="80">
    </div>
    <div>
      <label class="field" for="email">Email</label>
      <input class="input" type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div>
      <label class="field" for="password">Password</label>
      <input class="input" type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
      <span class="text-xs text-gray-500">At least 8 characters.</span>
    </div>
    <div>
      <label class="field" for="referral_code">Referral code (optional)</label>
      <input class="input" type="text" id="referral_code" name="referral_code" maxlength="20" placeholder="e.g. A1B2C3D4">
    </div>
    <button class="btn btn-primary w-full" type="submit">Create account</button>
    <p class="text-sm text-center text-gray-600">
      Have an account? <a href="/web/login" class="text-halalistic-green underline">Sign in</a>
    </p>
  </form>
</div>
{% endblock %}
