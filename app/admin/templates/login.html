{% extends "base.html" %}
{% block title %}Sign in — Halalistic Admin{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="muted">Internal tool for Platform Admins and Deal Curators.</p>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form method="post" action="/admin/ui/login" class="card" style="max-width:420px">
  <div class="row">
    <div style="flex:1">
      <label>Email</label>
      <input type="email" name="email" required autofocus style="width:100%">
    </div>
  </div>
  <div class="row">
    <div style="flex:1">
      <label>Password</label>
      <input type="password" name="password" required style="width:100%">
    </div>
  </div>
  <div class="row">
    <button class="btn primary" type="submit">Sign in</button>
  </div>
</form>
{% endblock %}
